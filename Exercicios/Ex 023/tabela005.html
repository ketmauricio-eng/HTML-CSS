<!DOCTYPE html>
<html lang="pt br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela 05</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        thead{
            background-color: gray;
            color: white;
        }
       table{
            border-collapse: collapse;
            width: 400px;
        }
       td, th{
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        tfoot{
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>

                <th rowspan="2" scope="row">Area</th>
                <th rowspan="2" scope="row">Disciplina</th>

            </tr>
            <tr>
                <th>nota 1</th>
                <th>nota 2</th>
            </tr>
        </thead>
        <tbody>

            </tr>
            <tr>

                <td>0.0</td>

            </tr>
            <tr>
                <td>Quimica</td>

            </tr>
            <tr>
                <td>Biologia</td>

            </tr>
            <tr style="background-color: gray;
            color: white;">
                <th colspan="4">Medias de Exatas</th>

            </tr>
            <tr>
                <th rowspan="2" scope="row">Humanas</th>
                <td>Historia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="4">Media de Humanas</th>

            </tr>
        </tfoot>
    </table>
    
</body>
</html>
